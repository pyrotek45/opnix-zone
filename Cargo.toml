[workspace]
resolver = "2"
members = ["crates/*", "games/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
oz_core = { path = "crates/oz_core" }
oz_net = { path = "crates/oz_net" }
oz_sim = { path = "crates/oz_sim" }
oz_client = { path = "crates/oz_client" }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
# Headless subset: enough for the simulation and dedicated servers.
bevy = { version = "=0.16.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_state", "bevy_log"] }

# Bevy systems naturally take many parameters and use rich query types.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
