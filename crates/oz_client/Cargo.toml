[package]
name = "oz_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["audio"]
audio = ["bevy/bevy_audio", "bevy/wav"]

[dependencies]
oz_core.workspace = true
oz_sim.workspace = true
bevy = { workspace = true, features = [
  "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_render", "bevy_pbr",
  "bevy_winit", "bevy_window", "bevy_gilrs", "bevy_text", "bevy_ui", "default_font",
  "x11", "wayland",
] }
